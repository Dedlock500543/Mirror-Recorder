buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// NOTE: the mod version lives in three places and they must stay in sync:
//   1. this file
//   2. src/main/resources/mcmod.info                          -> "version"
//   3. src/main/java/com/mirror/recorder/MirrorRecorder.java  -> VERSION
version = '1.0.0'
group = 'com.mirror.recorder'
archivesBaseName = 'Mirror-Recorder-1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    mappings channel: 'snapshot', version: '20171003-1.12'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            // Standard MDK development directory. Created on demand, never committed.
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    // Minecraft + Forge. This is the only compile dependency of the mod.
    // Baritone integration is fully optional and resolved by reflection at runtime,
    // so it is intentionally NOT declared here.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
}

jar {
    // Archive name is derived from archivesBaseName + version:
    //   Mirror-Recorder-1.12.2-1.0.0.jar
    manifest {
        attributes([
            "Specification-Title": "Mirror Recorder",
            "Specification-Vendor": "Mirror Recorder",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": "Mirror Recorder",
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Mirror Recorder",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    // No repository is declared on purpose: `gradlew publishToMavenLocal` works out of
    // the box and nothing is written to a machine specific directory. Add your own
    // repository here if you need to publish somewhere.
}

// FML does not support loading exploded directories as mods.
// Eclipse works fine because it merges classes and resources when debugging
// IntelliJ used to work because FG2 forced the files to be jared during debugging.
// Since FG3+ doesn't do that, we need to merge the sourcesets from gradle's side.
sourceSets.each {
    def dir = layout.buildDirectory.file("sourcesSets/$it.name").get().asFile
    it.output.resourcesDir = dir
    it.java.outputDir = dir
}

// ForgeGradle 3 needs a Java 8 JDK. On JDK 9+ it fails with confusing errors,
// so stop early with a message that actually explains what to do.
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(compileJava) && !JavaVersion.current().isJava8()) {
        throw new GradleException(
            "Mirror Recorder must be built with a Java 8 JDK, but Gradle is running on " +
            JavaVersion.current() + ". Set JAVA_HOME to a JDK 8 installation and run the build again.")
    }
}

// Convenience summary of the build environment: gradlew modInfo
task modInfo {
    group = 'help'
    description = 'Prints the mod and build environment parameters.'
    doLast {
        println '============================================================'
        println ' MIRROR RECORDER'
        println '============================================================'
        println " project        : ${project.name}"
        println " version        : ${project.version}"
        println " group          : ${project.group}"
        println " mappings       : snapshot 20171003-1.12"
        println " forge          : 1.12.2-14.23.5.2864"
        println " java (runtime) : ${System.getProperty('java.version')} / ${System.getProperty('java.vendor')}"
        println " java (target)  : ${project.sourceCompatibility}"
        println " gradle         : ${gradle.gradleVersion}"
        println " sources        : ${fileTree(dir: 'src/main/java', include: '**/*.java').files.size()} .java"
        println '============================================================'
    }
}
